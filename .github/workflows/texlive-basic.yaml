name: Build texlive-basic

on:
  workflow_dispatch:
    inputs:
      texlive_versions:
        description: JSON array of TeX Live versions to build (e.g., '["2025", "2026"]')
        required: false
        default: '["2020", "2021", "2022", "2023", "2024", "2025", "2026"]'
      texlive_cache:
        description: Whether to enable cache for TeX Live image builds (true/false)
        required: true
        type: boolean
        default: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ayaka-notes/texlive-basic

jobs:
  build-basic:
    strategy:
      fail-fast: false
      matrix:
        tex-version: ${{ fromJson(inputs.texlive_versions) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_pair: amd64
            texlive_bin_arch: x86_64-linux
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: arm64
            texlive_bin_arch: aarch64-linux

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Rand Wait to Avoid Thundering Herd
        run: sleep $((RANDOM % 500 + 1))

      - name: Checkout GitHub Action
        uses: actions/checkout@main
        with:
          submodules: true
          token: ${{ secrets.ORGTOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: texlive/${{ matrix.tex-version }}
          file: texlive/${{ matrix.tex-version }}/Dockerfile.basic
          platforms: ${{ matrix.platform }}
          build-args: |
            TEXLIVE_BIN_ARCH=${{ matrix.texlive_bin_arch }}
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tex-version }}.1.${{ matrix.platform_pair }}
          outputs: type=image,name-canonical=true,push=true,oci-mediatypes=true
          provenance: false
          sbom: false
          no-cache: ${{ !inputs.texlive_cache }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache-basic-${{ matrix.tex-version }}-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache-basic-${{ matrix.tex-version }}-${{ matrix.platform_pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.docker_build.outputs.digest }}"
          echo "${digest#sha256:}" > "${{ runner.temp }}/digests/${{ matrix.tex-version }}.${{ matrix.platform_pair }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tex-version }}-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/${{ matrix.tex-version }}.${{ matrix.platform_pair }}.txt
          if-no-files-found: error
          retention-days: 1

  merge-basic:
    runs-on: ubuntu-latest
    needs:
      - build-basic

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ORGTOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Create and push manifest lists in order
        shell: bash
        run: |
          set -euo pipefail

          DIGEST_DIR="${{ runner.temp }}/digests"

          for year in $(echo '${{ inputs.texlive_versions }}' | jq -r '.[]'); do

            AMD_DIGEST=$(cat "${DIGEST_DIR}/${year}.amd64.txt")
            ARM_DIGEST=$(cat "${DIGEST_DIR}/${year}.arm64.txt")

            echo "========== Merging ${year}.1 =========="

            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.title=texlive-basic" \
              --annotation "index:org.opencontainers.image.description=TeX Live ${year}.1 basic image for Overleaf, maintained by ayaka-notes. Multi-arch support for amd64 and arm64." \
              --annotation "index:org.opencontainers.image.source=https://github.com/ayaka-notes/texlive-full" \
              --annotation "index:org.opencontainers.image.version=${year}.1" \
              -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${year}.1 \
              ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${year}.1.amd64@sha256:${AMD_DIGEST} \
              ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${year}.1.arm64@sha256:${ARM_DIGEST}

            echo "========== Inspecting ${year}.1 =========="

            docker buildx imagetools inspect \
              ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${year}.1

          done
